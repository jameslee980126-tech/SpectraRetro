[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectraretro-research"
version = "0.1.0"
description = "C-H activation conditional retrosynthesis research code and artifacts"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["spectraretro*", "agentic_retrosynthesis*"]
namespaces = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"spectraretro.fusion_reranker" = ["assets/*", "*.json"]
