defaults:
  - retro_generative

_target_: src.models.ClassifierGuidanceModule

cond_cfg: ${data.cond_cfg}


net:
  use_cond: False

scheduler:
  _target_: src.models.lr_scheduler.PolyNomialLRScheduler
  _partial_: True
  warmup_steps: 500
  total_steps: ${trainer.max_steps}
  lr: ${..optimizer.lr}
  lr_end: 1e-5
  warmup_init_lr: 1e-07
  power: 0.3

