<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f9f5"><title>Research history · CHRetroAgent</title><link rel="stylesheet" href="/multipage.css"></head><body><header class="topbar"></header><main class="page"><div class="shell"><section class="surface-heading"><div class="kicker">Saved work, connected</div><h1>Keep every direction<br>in view.</h1><p class="lead">Revisit your planning analyses, compare alternatives, and capture the review that guides your next decision.</p><div class="toolbar"><button class="button lime" id="compare-selected" type="button">Compare selected reports</button><a class="button secondary" href="/workspace.html">New planning task ↗</a><span class="tag" id="history-count">Loading</span></div></section><div class="history-grid" id="history-grid"></div><section id="comparison" class="panel" style="margin-top:26px" hidden></section><section class="panel history-review"><div class="kicker">Expert perspective</div><h2 style="font-size:29px;margin-top:12px">Add a research review.</h2><form id="review-form"><div class="review-grid"><div class="field"><label for="review-analysis">Planning report</label><select id="review-analysis" required></select></div><div class="field"><label for="review-decision">Review outcome</label><select id="review-decision"><option value="pending">Needs further review</option><option value="approved">Approved for follow-up</option><option value="rejected">Rejected</option></select></div></div><div class="field"><label for="review-note">Notes & rationale</label><textarea class="input" id="review-note" rows="3" required placeholder="Record evidence, unresolved questions, or the next experimental check."></textarea></div><button class="button" type="submit">Save review</button><span id="review-status" class="field-note" role="status"></span></form><div id="review-list" class="side-list" style="margin-top:20px"></div></section></div></main><footer class="footer"></footer><script src="/core.js"></script><script src="/history-page.js"></script></body></html>
